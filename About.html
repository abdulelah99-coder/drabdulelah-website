<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>عن الطبيب — د. عبدالإله</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-screen-label="About">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">

function AboutHero() {
  return (
    <section style={{ paddingTop: 160, paddingBottom: 'var(--space-block)' }}>
      <div className="wrap">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'end' }}>
          <div>
            <span className="eyebrow">عن الطبيب — Profile</span>
            <h1 className="display-ar" style={{
              fontSize: 'clamp(56px, 6.5vw, 96px)', margin: '32px 0 0',
              letterSpacing: '-0.015em',
            }}>
              د. عبدالإله،
              <br />
              <em style={{ fontStyle: 'italic', color: 'var(--accent)' }}>الجرّاح والباحث</em>.
            </h1>
            <p className="display-en" style={{ fontSize: 26, margin: '20px 0 0', fontWeight: 300 }}>
              Surgeon. Researcher. Quietly precise.
            </p>
            <p style={{ marginTop: 40, fontSize: 17, lineHeight: 1.8, color: 'var(--fg-muted)', maxWidth: 560 }}>
              استشاريّ تجميل الأنف والجيوب الأنفية. أمضى أربعة عشر عاماً في دراسة الأنف
              من زاويتين: الوظيفة والجمال. يؤمن أن أفضل تجميل هو ما يَخفى أثره ويظهر جوهره.
            </p>
          </div>
          <div className="placeholder" data-label="EDITORIAL PORTRAIT · صورة بورتريه" style={{ aspectRatio: '4/5' }} />
        </div>
      </div>
    </section>
  );
}

function Bio() {
  return (
    <section style={{ paddingBlock: 'var(--space-block)', borderTop: '1px solid var(--hairline)' }}>
      <div className="wrap" style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 80 }}>
        <div style={{ position: 'sticky', top: 120, alignSelf: 'start' }}>
          <span className="eyebrow">السيرة — Biography</span>
        </div>
        <div>
          <p style={{ fontSize: 22, lineHeight: 1.7, fontFamily: 'var(--font-display-ar)', fontWeight: 400, color: 'var(--fg)' }}>
            وُلِد د. عبدالإله في الرياض، وتلقّى تعليمه الطبيّ في كلية الطب بجامعة الملك سعود
            قبل أن يُكمل تخصصه في جراحة الوجه والفكين وجراحة تجميل الأنف.
          </p>
          <p style={{ fontSize: 17, lineHeight: 1.8, color: 'var(--fg-muted)', marginTop: 32 }}>
            بعد إنهاء التخصص محلياً، توجّه إلى مستشفى Memorial Sloan Kettering في نيويورك
            ضمن زمالة جراحة التجميل، ثم إلى مستشفى Lariboisière في باريس متخصصاً في
            تقنيات الحفاظ على البنية (Preservation Rhinoplasty) على يدِ روّاد المدرسة الفرنسية.
          </p>
          <p style={{ fontSize: 17, lineHeight: 1.8, color: 'var(--fg-muted)', marginTop: 24 }}>
            عاد إلى الرياض ليؤسّس عيادته الخاصة عام ٢٠١٧، وقد أجرى منذ ذلك الحين أكثر من
            ألفٍ ومئتي عملية تجميل أنف، تتنوع بين الأولي والإصلاحي والوظيفي. يَنشر بانتظام
            في الدوريات الطبية، ويُحاضر في مؤتمرات الجمعية الأمريكية لجراحة الأنف.
          </p>
          <p style={{ fontSize: 17, lineHeight: 1.8, color: 'var(--fg-muted)', marginTop: 24 }}>
            خارج غرفة العمليات، يهتمّ بفنّ النحت والخطّ العربي — لقناعته بأن الجراحة
            الجمالية هي امتدادٌ هادئٌ لتقاليد فنّيّةٍ أقدم بكثير.
          </p>
        </div>
      </div>
    </section>
  );
}

function Timeline() {
  const items = [
    { year: '٢٠٠٨', ar: 'بكالوريوس الطب والجراحة', en: 'MBBS · King Saud University', loc: 'الرياض' },
    { year: '٢٠١٢', ar: 'إقامة في جراحة الأنف والأذن', en: 'ENT Residency · KFSH&RC', loc: 'الرياض' },
    { year: '٢٠١٥', ar: 'زمالة جراحة التجميل', en: 'Fellowship · Memorial Sloan Kettering', loc: 'نيويورك' },
    { year: '٢٠١٦', ar: 'زمالة تجميل الأنف الحافظ', en: 'Preservation Rhinoplasty · Lariboisière', loc: 'باريس' },
    { year: '٢٠١٧', ar: 'تأسيس العيادة الخاصة', en: 'Private practice founded',  loc: 'الرياض' },
    { year: '٢٠٢١', ar: 'بورد سعودي + بورد عربي',  en: 'Saudi & Arab Board certifications', loc: 'الرياض' },
    { year: '٢٠٢٤', ar: 'كرسي تدريسي زائر', en: 'Visiting faculty · KSU College of Medicine', loc: 'الرياض' },
  ];
  return (
    <section id="credentials" style={{ paddingBlock: 'var(--space-block)', borderTop: '1px solid var(--hairline)', background: 'var(--bg-elev)' }}>
      <div className="wrap">
        <div style={{ marginBottom: 64 }}>
          <span className="eyebrow">السيرة الزمنية — Timeline</span>
          <h2 className="display-ar" style={{ fontSize: 'clamp(40px, 4.5vw, 64px)', margin: '32px 0 0', letterSpacing: '-0.015em' }}>
            أربعة عشر عاماً من <em style={{ fontStyle: 'italic', color: 'var(--accent)' }}>الدراسة المتواصلة</em>.
          </h2>
        </div>
        <div style={{ borderTop: '1px solid var(--hairline-strong)' }}>
          {items.map((it, i) => (
            <div key={i} style={{
              display: 'grid', gridTemplateColumns: '120px 1fr auto',
              gap: 40, padding: '28px 0',
              borderBottom: '1px solid var(--hairline)',
              alignItems: 'center',
            }}>
              <div className="display-en" style={{
                fontFamily: 'var(--font-mono)', fontSize: 18,
                fontStyle: 'normal', color: 'var(--fg)',
              }}>{it.year}</div>
              <div>
                <div className="display-ar" style={{ fontSize: 22 }}>{it.ar}</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--fg-soft)', marginTop: 4 }}>
                  {it.en}
                </div>
              </div>
              <div style={{ fontSize: 14, color: 'var(--fg-muted)' }}>{it.loc}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Credentials() {
  const boards = [
    { ar: 'البورد السعودي للجراحة', en: 'Saudi Board of Surgery' },
    { ar: 'البورد العربي', en: 'Arab Board' },
    { ar: 'زمالة الكلية الأمريكية', en: 'Fellow · ACS' },
    { ar: 'الجمعية الأوروبية لتجميل الوجه', en: 'EAFPS Member' },
    { ar: 'الجمعية الدولية لجراحة الأنف', en: 'Rhinoplasty Society Intl.' },
    { ar: 'هيئة التخصصات الصحية', en: 'SCFHS Certified' },
  ];
  return (
    <section style={{ paddingBlock: 'var(--space-block)', borderTop: '1px solid var(--hairline)' }}>
      <div className="wrap">
        <div style={{ marginBottom: 56, textAlign: 'center' }}>
          <span className="eyebrow" style={{ display: 'inline-flex', justifyContent: 'center' }}>
            الإعتمادات — Board certifications
          </span>
          <h2 className="display-ar" style={{ fontSize: 'clamp(36px, 4vw, 56px)', margin: '32px auto 0', maxWidth: '20ch', letterSpacing: '-0.015em' }}>
            عضويّات معتمدة في جمعيات عالمية.
          </h2>
        </div>
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)',
          gap: 1, background: 'var(--hairline)',
          border: '1px solid var(--hairline)',
        }}>
          {boards.map((b, i) => (
            <div key={i} style={{
              background: 'var(--bg)', padding: '48px 32px', textAlign: 'center',
              minHeight: 200, display: 'flex', flexDirection: 'column', justifyContent: 'center',
            }}>
              <div style={{
                width: 48, height: 48, marginInline: 'auto', marginBottom: 24,
                border: '1px solid var(--hairline-strong)', borderRadius: '50%',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fg)" strokeWidth="1.4">
                  <path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z" />
                  <path d="M9 12l2 2 4-4" />
                </svg>
              </div>
              <div className="display-ar" style={{ fontSize: 20, fontWeight: 500 }}>{b.ar}</div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--fg-soft)', marginTop: 8 }}>
                {b.en}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Publications() {
  const pubs = [
    { year: '٢٠٢٤', journal: 'Aesthetic Surgery Journal', title: 'تقنيات الحفاظ على الجسر في الأنف الخليجي', en: 'Dorsal preservation in Gulf-region rhinoplasty' },
    { year: '٢٠٢٣', journal: 'Plastic & Reconstructive Surgery', title: 'إعادة بناء طُعم الغضروف في حالات الإصلاح', en: 'Costal cartilage grafting in revision cases' },
    { year: '٢٠٢٢', journal: 'Facial Plastic Surgery Clinics', title: 'الجمع بين التجميل وإصلاح الجيوب الأنفية', en: 'Combined functional + aesthetic rhinoplasty outcomes' },
    { year: '٢٠٢١', journal: 'JAMA Facial Plastic Surgery', title: 'الفرق بين المدرستين الفرنسية والأمريكية', en: 'Comparing French vs. American rhinoplasty doctrines' },
  ];
  return (
    <section style={{ paddingBlock: 'var(--space-block)', borderTop: '1px solid var(--hairline)', background: 'var(--bg-elev)' }}>
      <div className="wrap">
        <div style={{ marginBottom: 56 }}>
          <span className="eyebrow">المنشورات — Selected publications</span>
          <h2 className="display-ar" style={{ fontSize: 'clamp(36px, 4vw, 56px)', margin: '32px 0 0', letterSpacing: '-0.015em' }}>
            بحوث محكَّمة في دوريّاتٍ عالمية.
          </h2>
        </div>
        <div style={{ borderTop: '1px solid var(--hairline-strong)' }}>
          {pubs.map((p, i) => (
            <a key={i} href="#" style={{
              display: 'grid', gridTemplateColumns: '100px 1fr 220px 40px',
              gap: 32, padding: '32px 0',
              borderBottom: '1px solid var(--hairline)',
              alignItems: 'center',
              transition: 'padding .2s',
            }}
            onMouseEnter={(e) => { e.currentTarget.style.paddingInlineStart = '16px'; }}
            onMouseLeave={(e) => { e.currentTarget.style.paddingInlineStart = '0'; }}
            >
              <span className="display-en" style={{ fontFamily: 'var(--font-mono)', fontSize: 16, fontStyle: 'normal', color: 'var(--fg)' }}>{p.year}</span>
              <div>
                <div className="display-ar" style={{ fontSize: 22, color: 'var(--fg)' }}>{p.title}</div>
                <div style={{ fontFamily: 'var(--font-display-en)', fontStyle: 'italic', fontSize: 15, color: 'var(--fg-muted)', marginTop: 6 }}>
                  {p.en}
                </div>
              </div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--fg-soft)' }}>
                {p.journal}
              </div>
              <span style={{ fontSize: 20, color: 'var(--fg-soft)' }}>←</span>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}

function Press() {
  const items = [
    { outlet: 'ELLE Arabia', date: '٢٠٢٥', ar: 'الجمال الذي يحترم الملامح',          en: 'Beauty that respects identity' },
    { outlet: 'العربية',       date: '٢٠٢٥', ar: 'تقنيات الحفاظ على الأنف',          en: 'Preservation techniques' },
    { outlet: 'Vogue Arabia', date: '٢٠٢٤', ar: 'حوار: الفنّ خلف المشرط',           en: 'The art behind the scalpel' },
  ];
  return (
    <section id="press" style={{ paddingBlock: 'var(--space-block)', borderTop: '1px solid var(--hairline)' }}>
      <div className="wrap">
        <div style={{ marginBottom: 56 }}>
          <span className="eyebrow">الإعلام — In the press</span>
          <h2 className="display-ar" style={{ fontSize: 'clamp(36px, 4vw, 56px)', margin: '32px 0 0', letterSpacing: '-0.015em' }}>
            حضورٌ في الإعلام العربي والعالمي.
          </h2>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'var(--hairline)' }}>
          {items.map((p, i) => (
            <a key={i} href="#" style={{ background: 'var(--bg)', padding: 32, display: 'block', transition: 'background .25s' }}
              onMouseEnter={(e) => e.currentTarget.style.background = 'var(--bg-elev)'}
              onMouseLeave={(e) => e.currentTarget.style.background = 'var(--bg)'}>
              <div className="placeholder" data-label={`${p.outlet} · ${p.date}`} style={{ aspectRatio: '4/3', marginBottom: 28 }} />
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--fg-soft)' }}>
                {p.outlet} · {p.date}
              </div>
              <h3 className="display-ar" style={{ fontSize: 24, margin: '16px 0 0', lineHeight: 1.3 }}>{p.ar}</h3>
              <p className="display-en" style={{ fontSize: 15, marginTop: 8 }}>{p.en}</p>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}

function AboutCTA() {
  return (
    <section style={{ paddingBlock: 'var(--space-section)', background: 'var(--bg-deep)', borderTop: '1px solid var(--hairline)' }}>
      <div className="wrap" style={{ textAlign: 'center' }}>
        <span className="eyebrow" style={{ display: 'inline-flex', justifyContent: 'center' }}>الخطوة التالية — Next step</span>
        <h2 className="display-ar" style={{
          fontSize: 'clamp(48px, 6vw, 88px)', margin: '32px auto 0',
          maxWidth: '18ch', letterSpacing: '-0.015em',
        }}>
          محادثةٌ هادئةٌ تُجيب عن كلّ أسئلتك.
        </h2>
        <p style={{ marginTop: 24, fontSize: 17, color: 'var(--fg-muted)', maxWidth: 520, marginInline: 'auto' }}>
          استشارة أولية بدون التزام — للتعرّف، والاستماع، والإجابة بصراحة.
        </p>
        <a href="index.html#contact" className="btn" style={{ marginTop: 40 }}>
          <span>احجز موعد الاستشارة</span>
          <span className="arrow" />
        </a>
      </div>
    </section>
  );
}

function App() {
  React.useEffect(() => {
    const obs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add('in'); }),
      { rootMargin: '-10% 0px -10% 0px' });
    document.querySelectorAll('section').forEach((s) => { s.classList.add('reveal'); obs.observe(s); });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <SiteNav current="about" />
      <main>
        <AboutHero />
        <Bio />
        <Timeline />
        <Credentials />
        <Publications />
        <Press />
        <AboutCTA />
      </main>
      <SiteFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
