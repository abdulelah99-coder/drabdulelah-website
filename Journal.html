function ArticleGrid() {
  const [activeCategory, setActiveCategory] = React.useState('الكل');
  const [view, setView] = React.useState('grid');

  const filtered = activeCategory === 'الكل'
    ? ARTICLES.filter(a => !a.featured)
    : ARTICLES.filter(a => !a.featured && a.category === activeCategory);

  return (
    <section style={{ paddingBlock: 'var(--space-section)' }}>
      <div className="wrap">

        {/* Header row */}
        <div style={{
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'flex-end',
          marginBottom: 56,
          gap: 40,
        }}>
          <div>
            <span className="eyebrow">الأرشيف — Archive</span>
            <h2 className="display-ar" style={{
              fontSize: 'clamp(36px, 4vw, 52px)',
              margin: '28px 0 0',
              letterSpacing: '-0.015em',
            }}>
              جميع المقالات.
            </h2>
          </div>

          {/* View toggle */}
          <div style={{
            display: 'flex',
            border: '1px solid var(--hairline-strong)',
          }}>
            {[['grid', '⊞'], ['list', '≡']].map(([v, icon]) => (
              <button key={v} onClick={() => setView(v)} style={{
                padding: '10px 18px',
                background: view === v ? 'var(--fg)' : 'transparent',
                color: view === v ? 'var(--bg)' : 'var(--fg-soft)',
                border: 'none',
                cursor: 'pointer',
                fontFamily: 'var(--font-mono)',
                fontSize: 14,
                transition: 'background .2s, color .2s',
              }}>{icon}</button>
            ))}
          </div>
        </div>

        {/* Category filter */}
        <div style={{
          display: 'flex',
          gap: 0,
          marginBottom: 48,
          borderBottom: '1px solid var(--hairline)',
          overflowX: 'auto',
        }}>
          {CATEGORIES.map((cat) => (
            <button key={cat} onClick={() => setActiveCategory(cat)} style={{
              padding: '14px 24px',
              background: 'transparent',
              border: 'none',
              borderBottom: activeCategory === cat ? '2px solid var(--accent)' : '2px solid transparent',
              color: activeCategory === cat ? 'var(--fg)' : 'var(--fg-muted)',
              fontFamily: 'var(--font-body-ar)',
              fontSize: 14,
              cursor: 'pointer',
              whiteSpace: 'nowrap',
              transition: 'color .2s, border-color .2s',
              marginBottom: -1,
            }}>
              {cat}
            </button>
          ))}
        </div>

        {/* Articles */}
        {view === 'grid' ? (
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(3, 1fr)',
            borderTop: '1px solid var(--hairline)',
          }}>
            {filtered.map((article) => (
              <ArticleCard key={article.id} article={article} />
            ))}
          </div>
        ) : (
          <div style={{ borderTop: '1px solid var(--hairline-strong)' }}>
            {filtered.map((article) => (
              <ArticleRow key={article.id} article={article} />
            ))}
          </div>
        )}

        {filtered.length === 0 && (
          <div style={{
            textAlign: 'center',
            padding: '80px 0',
            color: 'var(--fg-muted)',
            fontFamily: 'var(--font-display-ar)',
            fontSize: 24,
          }}>
            لا مقالات في هذا التصنيف حتى الآن.
          </div>
        )}

      </div>
    </section>
  );
}

                  </p>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  React.useEffect(() => {
    const obs = new IntersectionObserver(
      (es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add('in'); }),
      { rootMargin: '-10% 0px -10% 0px' }
    );
    document.querySelectorAll('section').forEach((s) => {
      s.classList.add('reveal');
      obs.observe(s);
    });
    return () => obs.disconnect();
  }, []);

  const featured = ARTICLES.find(a => a.featured);

  return (
    <>
      <SiteNav current="journal" />
      <main>
        <JournalHero />
        <FeaturedArticle article={featured} />
        <ArticleGrid />
        <FaqTeaser />
        <NewsletterCTA />
      </main>
      <SiteFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
